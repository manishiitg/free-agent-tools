name: Validate catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate.py
      - run: python scripts/build.py --check
      - run: python scripts/smoke_mcp.py
      - run: node --check docs/assets/app.js
      - run: npm install --no-save playwright@1.62.1
      - name: Use the runner's installed Chrome
        run: |
          catalog_chrome_path="$(command -v google-chrome)"
          "$catalog_chrome_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$catalog_chrome_path" >> "$GITHUB_ENV"
      - run: node scripts/smoke_site.cjs
      - name: Verify the native HQ catalog integration
        run: |
          git clone --depth 1 https://github.com/manishiitg/multi-builder-public-website.git "$RUNNER_TEMP/agentworks-hq"
          python "$RUNNER_TEMP/agentworks-hq/scripts/sync-free-tools.py" --source "$GITHUB_WORKSPACE/docs"
          FREE_TOOLS_SITE_ROOT="$RUNNER_TEMP/agentworks-hq" FREE_TOOLS_SITE_PATH=/free-tools/ node scripts/smoke_site.cjs
